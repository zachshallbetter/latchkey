# Experimental sandbox configuration. This does not establish functional parity or submission readiness.
# Generate/build through scripts/build-appstore-sandbox.py, which snapshots source before XcodeGen runs.
include:
  - project.yml
name: LatchkeyAppStoreSandbox

# The App Store updates through the App Store: no Sparkle package, dependency or Info.plist keys.
packages:REPLACE:
  LatchkeyCore:
    path: ..

targets:
  Latchkey:
    dependencies:REPLACE:
      - package: LatchkeyCore
        product: LatchkeyCore
      - target: LatchkeySafari
    sources:
      - path: Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: AppStore/Latchkey.entitlements
      properties:REPLACE:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)io.snackstud.latchkey
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.snackstud.latchkey
    info:
      path: AppStore/Info.plist
      properties:REPLACE:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Latchkey
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMultipleInstancesProhibited: true
        NSHumanReadableCopyright: Copyright © 2026 Snack Studio
        LatchkeyAccessGroup: $(AppIdentifierPrefix)io.snackstud.latchkey
        LatchkeyAppGroup: $(TeamIdentifierPrefix)io.snackstud.latchkey
        LatchkeyDistributionChannel: app-store
        ITSAppUsesNonExemptEncryption: true
    settings:
      base:
        ENABLE_APP_SANDBOX: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LATCHKEY_APP_STORE

  # Only build metadata is overridden here. Safari source/resources remain owned by the extension work.
  LatchkeySafari:
    info:
      path: AppStore/Safari.Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 Snack Studio

# Same scheme XcodeGen would generate, plus the local StoreKit configuration for testing Latchkey Pro (Debug runs only).
schemes:
  Latchkey:
    build:
      targets:
        Latchkey: all
    run:
      config: Debug
      storeKitConfiguration: AppStore/Latchkey.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
