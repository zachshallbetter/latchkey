# Generate the Xcode project with:  cd App && xcodegen
# DEVELOPMENT_TEAM signs the app; iCloud Keychain needs a signed app. Every Mac must use the same team.
name: Latchkey
options:
  bundleIdPrefix: io.snackstud
  deploymentTarget:
    macOS: "15.0"
packages:
  LatchkeyCore:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: "PKH7G93GGD"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Latchkey:
    type: application
    platform: macOS
    sources: [Latchkey]
    dependencies:
      - package: LatchkeyCore
        product: LatchkeyCore
    entitlements:
      path: Latchkey/Latchkey.entitlements
      properties:
        # iCloud Keychain (synchronizable, data-protection keychain) is only open to signed apps
        # with an access group. Not sandboxed: the broker reads other processes' paths to name callers.
        # The first group is Latchkey's; the second is the one 0.1.0 development builds used, kept so the app can
        # move items out of it (see StoreMigration.adopt).
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.snackstud.latchkey
          - $(AppIdentifierPrefix)io.latchkey.shared
    info:
      path: Latchkey/Info.plist
      properties:
        CFBundleDisplayName: Latchkey
        LSApplicationCategoryType: public.app-category.developer-tools
        # One Latchkey at a time: two would compete for the broker socket and the approval panel.
        LSMultipleInstancesProhibited: true
        NSHumanReadableCopyright: ""
        LatchkeyAccessGroup: $(AppIdentifierPrefix)io.snackstud.latchkey
        LatchkeyPreviousAccessGroup: $(AppIdentifierPrefix)io.latchkey.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.snackstud.latchkey
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
